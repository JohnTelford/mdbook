[book]
title = "My mdbook-project"
author = "John Telford"
description = "A modern, Markdown-powered site built with mdBook."
language = "en"

[build]
# Where the HTML output will be placed
build-dir = "book"
# Automatically create missing chapters listed in SUMMARY.md
create-missing = true
# Keep older builds clean
use-default-preprocessors = true

[output.html]
# Default visual theme
default-theme = "light"
# Preferred dark mode theme
preferred-dark-theme = "navy"
additional-js = ["js/pagetoc.js"]
additional-css = ["theme/pagetoc.css"]

# Show copy buttons on code blocks
copy-js = true

# Enable search feature
search.enable = true

# Control HTML renderer options
curly-quotes = truejs/custom.jsport = true
additional-css = ["css/custom.css"]
additional-js = ["js/custom.js"]

[preprocessor.toc]
# Optional: add automatic Table of Contents support
command = "mdbook-toc"

[preprocessor.pagetoc]
# Heading levels to include in the per-page TOC
toc_levels = [2, 3, 4]
# Whether to scroll TOC automatically as user scrolls content
scroll = true

