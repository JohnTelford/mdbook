[book]
title = "My mdBook Project"
author = "John Telford"
description = "A modern, Markdown-powered site built with mdBook."
language = "en"

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]

[output.html]
theme = "theme"
additional-css = ["theme/pagetoc.css"]
additional-js = ["theme/pagetoc.js"]

[preprocessor.pagetoc]
# Heading levels to include in the per-page TOC
toc_levels = [2, 3, 4]
# Whether to scroll TOC automatically as user scrolls content
scroll = true

[build]
# Where the HTML output will be placed
build-dir = "book"

[output.html]
# Default visual theme
default-theme = "light"
# Preferred dark mode theme
preferred-dark-theme = "rust"


# Enable search feature
search.enable = true

# Allow collapsible sections in sidebar
fold.enable = true

# Customize the title bar and favicon (optional)
# favicon = "src/assets/favicon.png"

# Add repository links (great for GitHub)
# git-repository-url = "https://github.com/yourusername/yourbook"
# edit-url-template = "https://github.com/yourusername/yourbook/# edit/main/{path}"

# Control HTML renderer options
#curly-quotes = true
#mathjax-support = true
#additional-css = ["css/custom.css"]
#additional-js = ["js/custom.js"]
#
[output.html.print]
# If you want to generate a printable version
enable = false


